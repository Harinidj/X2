# Server Configuration
server.port=8080

# H2 Database Configuration (In-Memory for quick development)
spring.datasource.url=jdbc:h2:mem:x2db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=HARINIdj#613
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate/JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Thymeleaf Configuration (Defaults - included for clarity)
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# Custom Application Properties
# IMPORTANT: Adjust this path for production. This path is relative to the project root.
app.upload.dir=./uploads/
# Map /uploads/** requests to the local upload directory
spring.web.resources.static-locations=classpath:/static/,file:./uploads/