<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title is now dynamic -->
    <title th:text="${loggedUser.username} + ' / X²'">Profile / X²</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: white; }
        .x2-blue { color: #1D9BF0; }
        .border-x-main { border-color: #2F3336; }
        .post-input:focus { box-shadow: none; border-color: transparent; }
        .post-box { border-bottom: 1px solid #2F3336; }
    </style>
</head>
<body class="min-h-screen">
<div class="max-w-7xl mx-auto flex h-full">
    <!-- Left Sidebar (Navigation) -->
    <nav class="hidden md:block w-full md:w-1/4 lg:w-1/5 xl:w-1/6 sticky top-0 h-screen p-4 xl:p-6 border-r border-gray-800">
        <div class="space-y-3">
            <div class="text-white text-3xl font-extrabold x2-blue p-2">X²</div>
            <a th:href="@{/posts/feed}" class="flex items-center space-x-4 p-3 rounded-full hover:bg-gray-800 transition">
                <i class="fas fa-home text-xl"></i>
                <span class="text-xl font-bold hidden xl:block">Home</span>
            </a>
            <!-- Profile link is now active -->
            <a th:href="@{/posts/my}" class="flex items-center space-x-4 p-3 rounded-full hover:bg-gray-800 transition x2-blue">
                <i class="fas fa-user text-xl"></i>
                <span class="text-xl font-medium hidden xl:block">Profile</span>
            </a>
            <form th:action="@{/logout}" method="post" class="w-full">
                <button type="submit" class="flex items-center space-x-4 p-3 rounded-full hover:bg-gray-800 transition w-full text-left text-red-500">
                    <i class="fas fa-sign-out-alt text-xl"></i>
                    <span class="text-xl font-medium hidden xl:block">Logout</span>
                </button>
            </form>
        </div>

        <!-- User Info at Bottom -->
        <div class="absolute bottom-4" th:if="${loggedUser != null}">
            <div class="flex items-center space-x-2 p-2 rounded-full hover:bg-gray-800 transition cursor-pointer">
                <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-sm font-bold" th:text="${loggedUser.username.charAt(0)}">U</div>
                <div class="hidden xl:block">
                    <p class="font-bold text-sm" th:text="${loggedUser.username}">Username</p>
                    <p class="text-gray-500 text-xs" th:text="${loggedUser.email}">Email</p>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content (Profile Feed) -->
    <main class="w-full md:w-3/4 lg:w-3/5 xl:w-1/2 border-x border-gray-800 min-h-screen">
        <header class="sticky top-0 bg-black bg-opacity-70 backdrop-blur-md border-b border-gray-800 z-10 p-4">
            <!-- Header now shows username -->
            <h1 class="text-xl font-bold" th:text="${loggedUser.username}">User Profile</h1>
            <!-- You could add post count here later -->
            <!-- <p class="text-xs text-gray-500">0 Posts</p> -->
        </header>

        <!-- Post Creation Box (Same as feed.html, works fine) -->
        <div class="p-4 post-box">
            <form th:action="@{/posts/add}" method="POST" enctype="multipart/form-data" class="space-y-4">
                <div class="flex space-x-3">
                    <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-sm font-bold shrink-0" th:text="${loggedUser.username.charAt(0)}">U</div>
                    <textarea name="content" rows="3" placeholder="What is happening?!" maxlength="280" required
                              class="w-full bg-black text-white text-xl resize-none post-input border-none p-0 focus:ring-0"
                              oninput="updateCharCount(this)"></textarea>
                </div>
                <div class="flex justify-between items-center pt-2 border-t border-gray-800">
                    <div class="flex items-center space-x-4 text-sm text-gray-500">
                        <label for="image-upload" class="cursor-pointer x2-blue hover:text-blue-400">
                            <i class="far fa-image text-xl"></i>
                        </label>
                        <input type="file" id="image-upload" name="image" accept="image/*" class="hidden">
                    </div>
                    <div class="flex items-center space-x-3">
                        <span id="char-count" class="text-gray-500 text-sm">280</span>
                        <button type="submit" class="px-4 py-2 bg-blue-500 text-white font-bold rounded-full hover:bg-blue-600 transition disabled:opacity-50"
                                id="post-button" disabled>
                            Post
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- User's Timeline Posts -->
        <!-- This loop is the same, but the 'posts' variable only contains the user's posts -->
        <div th:each="post : ${posts}" class="p-4 post-box" th:id="'post-' + ${post.id}">
            <div class="flex space-x-3">
                <div class="w-10 h-10 bg-gray-600 rounded-full flex items-center justify-center text-sm font-bold shrink-0" th:text="${post.user.username.charAt(0)}">U</div>
                <div class="flex-grow">
                    <div class="flex justify-between items-center">
                        <p class="font-bold">
                            <span th:text="${post.user.username}">User</span>
                            <span class="text-gray-500 font-normal" th:text="'@' + ${post.user.username}">@user</span>
                        </p>
                        <span class="text-gray-500 text-sm" th:text="${#temporals.format(post.timestamp, 'MMM dd')}">Date</span>
                    </div>
                    <p class="mt-1 text-base" th:text="${post.content}">Post content</p>

                    <div th:if="${post.imagePath}" class="mt-3 rounded-xl overflow-hidden border border-gray-800">
                        <img th:src="@{${post.imagePath}}" alt="Post Image" class="w-full h-auto object-cover">
                    </div>

                    <div class="flex justify-between mt-3 text-gray-500 text-lg">
                        <button class="hover:text-blue-500 transition comment-btn" th:data-post-id="${post.id}">
                            <i class="far fa-comment"></i>
                        </button>
                        <button th:data-post-id="${post.id}"
                                th:with="liked=${interactionService.isLikedByUser(loggedUser, post)}"
                                th:data-is-liked="${liked}"
                                class="like-btn transition"
                                th:classappend="${liked ? 'text-red-500' : 'hover:text-red-500'}">
                            <i th:classappend="${liked ? 'fas fa-heart' : 'far fa-heart'}"></i>
                            <span class="text-sm ml-1 like-count" th:id="'like-count-' + ${post.id}" th:text="${interactionService.countLikes(post)}">0</span>
                        </button>
                        <button class="hover:text-blue-500 transition">
                            <i class="fas fa-share-alt"></i>
                        </button>
                    </div>

                    <div class="mt-4 border-t border-gray-900 pt-3 hidden comments-section" th:id="'comments-for-' + ${post.id}">
                        <h4 class="text-sm font-bold mb-2">Comments:</h4>
                        <div th:each="comment : ${interactionService.getComments(post)}" class="text-sm mb-1" th:id="'comment-' + ${comment.id}">
                            <span class="font-bold text-gray-300" th:text="${comment.user.username}"></span>
                            <span class="text-gray-400 ml-2" th:text="${comment.text}"></span>
                        </div>
                        <form th:id="'comment-form-' + ${post.id}" class="mt-3 flex space-x-2 comment-form" th:data-post-id="${post.id}">
                            <input type="text" name="text" required placeholder="Write a comment..." class="flex-grow p-2 text-sm bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:border-blue-500">
                            <button type="submit" class="px-3 py-1 bg-blue-500 text-white text-sm font-medium rounded-lg hover:bg-blue-600 transition">Post</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Placeholder if user has no posts -->
        <div th:if="${#lists.isEmpty(posts)}" class="text-center p-10 text-gray-500">
            <p>You haven't posted anything yet.</p>
        </div>
    </main>

    <!-- Right Sidebar (Trends/Suggestions) -->
    <aside class="hidden lg:block w-1/4 xl:w-1/5 p-4 sticky top-0 h-screen">
        <div class="bg-gray-900 rounded-xl p-4 space-y-4">
            <h3 class="text-xl font-extrabold">Who to follow</h3>
            <div class="flex items-center justify-between">
                <div>
                    <p class="font-bold">Dummy User</p>
                    <p class="text-gray-500 text-sm">@dummyuser</p>
                </div>
                <button class="px-3 py-1 bg-white text-black text-sm font-bold rounded-full hover:bg-gray-200 transition">Follow</button>
            </div>
        </div>
    </aside>

</div>

<!-- Same JavaScript as feed.html -->
<script>
    function updateCharCount(textarea) {
        const count = textarea.value.length;
        const remaining = 280 - count;
        document.getElementById('char-count').textContent = remaining;
        document.getElementById('post-button').disabled = count === 0 || count > 280;
    }

    document.querySelectorAll('.like-btn').forEach(button => {
        button.addEventListener('click', function() {
            const postId = this.getAttribute('data-post-id');
            const likeCountSpan = document.getElementById(`like-count-${postId}`);
            const formData = new URLSearchParams();
            formData.append('postId', postId);

            fetch('/api/like', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    console.error('Like failed:', data.error);
                    return;
                }
                this.setAttribute('data-is-liked', data.liked);
                this.classList.toggle('text-red-500', data.liked);
                this.querySelector('i').classList.toggle('far', !data.liked);
                this.querySelector('i').classList.toggle('fas', data.liked);
                likeCountSpan.textContent = data.count;
            })
            .catch(error => console.error('Error toggling like:', error));
        });
    });

    document.querySelectorAll('.comment-btn').forEach(button => {
        button.addEventListener('click', function() {
            const postId = this.getAttribute('data-post-id');
            const commentsSection = document.getElementById(`comments-for-${postId}`);
            commentsSection.classList.toggle('hidden');
        });
    });

    document.querySelectorAll('.comment-form').forEach(form => {
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const postId = this.getAttribute('data-post-id');
            const input = this.querySelector('input[name="text"]');
            const text = input.value.trim();
            if (!text) return;

            const data = new URLSearchParams();
            data.append('postId', postId);
            data.append('text', text);

            fetch('/api/comment', {
                method: 'POST',
                body: data,
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            })
            .then(response => response.json())
            .then(commentData => {
                if (commentData.ok) {
                    input.value = '';
                    const commentsSection = document.getElementById(`comments-for-${postId}`);
                    const newCommentDiv = document.createElement('div');
                    newCommentDiv.className = 'text-sm mb-1';
                    newCommentDiv.innerHTML = `<span class="font-bold text-gray-300">${commentData.commentUser}</span> <span class="text-gray-400 ml-2">${commentData.text}</span>`;
                    commentsSection.insertBefore(newCommentDiv, this);
                } else {
                    console.error('Comment failed:', commentData.error);
                }
            })
            .catch(error => console.error('Error submitting comment:', error));
        });
    });

    document.addEventListener('DOMContentLoaded', () => {
        const textarea = document.querySelector('textarea[name="content"]');
        if (textarea) updateCharCount(textarea);
    });
</script>
</body>
</html>
